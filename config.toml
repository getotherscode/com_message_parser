# serial port
[serial]
description = "CH343"
baudrate = 9600
bytesize = 8
parity = "N"
stopbits = 1
timeout = 1

# recv message , identification is before parse
## message type
## message struct
### byte : byte_offset, description , if data type length bigger than 1, must mark big/small endian
#### bit : bit_offset, description
[message]

#run time data
[[message.recv]]
msg_type_desc = "run-time"

[message.recv.msg_type_code]
byte_offset = 1
value = 0x70

[[message.recv.msg_struct]]
description = "address"
byte_offset = 0
data_type = "u8"
scale = 1

